# Tiny Tapeout project information
project:
  title:        "Hyper Core: RV32I Pipelined CPU"
  author:       "hyhl-tech"
  discord:      ""
  description:  "5-stage pipelined RV32I CPU with full bypass and hazard detection"
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_hyhl_hypercore"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_hyhl_hypercore.v"
    - "cpu_top.v"
    - "alu.v"
    - "regfile.v"
    - "imm_gen.v"
    - "alu_control.v"
    - "controller.v"
    - "load_ext.v"
    - "imem.v"
    - "dmem.v"
    - "core_defs.vh"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "reset (active high)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "pc_out[0]"
  uo[1]: "pc_out[1]"
  uo[2]: "pc_out[2]"
  uo[3]: "pc_out[3]"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
  uio[7]: ""

# Do not change!
yaml_version: 6
